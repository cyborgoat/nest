name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      release_id: ${{ steps.release.outputs.release_id }}
      release_is_draft: ${{ steps.release.outputs.release_is_draft }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"
          fi

      - name: Read version and verify version files agree
        id: version
        run: |
          TAURI_V=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          PKG_V=$(jq -r .version apps/desktop/package.json)
          CARGO_V=$(grep -m1 '^version' apps/desktop/src-tauri/Cargo.toml | sed 's/version *= *"\(.*\)"/\1/')
          if [ "$TAURI_V" != "$PKG_V" ] || [ "$TAURI_V" != "$CARGO_V" ]; then
            echo "::error::Version mismatch: tauri.conf.json=$TAURI_V, package.json=$PKG_V, Cargo.toml=$CARGO_V. All three must match."
            exit 1
          fi

          EXPECTED_TAG="v$TAURI_V"
          if [ "${{ steps.tag.outputs.tag }}" != "$EXPECTED_TAG" ]; then
            echo "::error::Tag/version mismatch: tag=${{ steps.tag.outputs.tag }}, expected=$EXPECTED_TAG from desktop version files."
            exit 1
          fi

          echo "version=$TAURI_V" >> "$GITHUB_OUTPUT"

      - name: Create or reuse release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            RELEASE_ID=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json id --jq .id)
            RELEASE_IS_DRAFT=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "Nest $TAG" \
              --target "$GITHUB_SHA" \
              --notes "Unsigned builds. macOS: right-click > Open (or run \`xattr -dr com.apple.quarantine /Applications/Nest.app\`) on first launch. Windows: choose \"More info\" > \"Run anyway\" on the SmartScreen prompt."

            RELEASE_ID=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json id --jq .id)
            RELEASE_IS_DRAFT=true
          fi

          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "release_is_draft=$RELEASE_IS_DRAFT" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            runner: macos-latest
            rust_target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
          - name: macOS (Intel)
            runner: macos-latest
            rust_target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles dmg
          - name: Windows (x64)
            runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
            args: --bundles msi,nsis
    runs-on: ${{ matrix.runner }}
    name: Build ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.rust_target }}

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/desktop

      - name: Build installers and upload to draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.gate.outputs.release_id }}
          args: ${{ matrix.args }}

  publish:
    needs: [gate, build]
    if: needs.gate.outputs.release_is_draft == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${{ needs.gate.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false
