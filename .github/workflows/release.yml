name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build, for example v0.1.0
        required: true
        type: string

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_is_draft: ${{ steps.release.outputs.release_is_draft }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Read version and verify version files agree
        id: version
        run: |
          TAURI_V=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          PKG_V=$(jq -r .version apps/desktop/package.json)
          CARGO_V=$(grep -m1 '^version' apps/desktop/src-tauri/Cargo.toml | sed 's/version *= *"\(.*\)"/\1/')
          if [ "$TAURI_V" != "$PKG_V" ] || [ "$TAURI_V" != "$CARGO_V" ]; then
            echo "::error::Version mismatch: tauri.conf.json=$TAURI_V, package.json=$PKG_V, Cargo.toml=$CARGO_V. All three must match."
            exit 1
          fi

          EXPECTED_TAG="v$TAURI_V"
          if [ "${{ env.RELEASE_TAG }}" != "$EXPECTED_TAG" ]; then
            echo "::error::Tag/version mismatch: tag=${{ env.RELEASE_TAG }}, expected=$EXPECTED_TAG from desktop version files."
            exit 1
          fi

          echo "version=$TAURI_V" >> "$GITHUB_OUTPUT"

      - name: Detect release draft state
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ env.RELEASE_TAG }}"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            RELEASE_IS_DRAFT=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          else
            RELEASE_IS_DRAFT=true
          fi

          echo "release_is_draft=$RELEASE_IS_DRAFT" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            runner: macos-15
            rust_target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
          - name: Windows (x64)
            runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
            args: --bundles msi,nsis
    runs-on: ${{ matrix.runner }}
    name: Build ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.rust_target }}

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/desktop

      - name: Build and upload release bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Nest ${{ env.RELEASE_TAG }}
          releaseBody: |
            Unsigned builds. macOS: right-click > Open (or run `xattr -dr com.apple.quarantine /Applications/Nest.app`) on first launch. Windows: choose "More info" > "Run anyway" on the SmartScreen prompt.
          releaseDraft: ${{ needs.gate.outputs.release_is_draft }}
          prerelease: false
          generateReleaseNotes: true
          releaseAssetNamePattern: Nest_${{ env.RELEASE_TAG }}_[platform]_[arch][setup][ext]
          args: ${{ matrix.args }}

  publish:
    needs: [gate, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        if: needs.gate.outputs.release_is_draft == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${{ env.RELEASE_TAG }}" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false
