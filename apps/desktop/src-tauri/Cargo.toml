[package]
name = "nest"
version = "0.0.4"
description = "Nest — local-first knowledge workspace"
authors = ["Nest"]
edition = "2021"

[lib]
name = "nest_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "rustls-tls", "socks"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
walkdir = "2"
zip = "2"
parking_lot = "0.12"
rig = { version = "0.40", features = ["derive"] }
rig-fastembed = { version = "0.40", default-features = false, features = ["ort-download-binaries"] }
fastembed = { version = "=4.9.1", default-features = false, features = ["ort-download-binaries"] }
rig-sqlite = "0.40"
sqlite-vec = "0.1.9"
tokio-rusqlite = { version = "0.6", features = ["bundled"] }
futures = "0.3.32"
dotenvy = "0.15.7"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
base64 = "0.22"
include_dir = "0.7"
