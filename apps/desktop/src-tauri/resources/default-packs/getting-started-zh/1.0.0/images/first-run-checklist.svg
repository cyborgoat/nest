<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360" role="img" aria-label="First run checklist">
  <rect width="980" height="360" rx="18" fill="#f7f7f8"/>
  <text x="40" y="52" font-family="Arial, sans-serif" font-size="28" fill="#27272a">First-run checklist</text>

  <g font-family="Arial, sans-serif" font-size="15" fill="#27272a">
    <rect x="40" y="88" width="900" height="54" rx="10" fill="#ffffff" stroke="#d8d8de"/>
    <text x="60" y="122">1. Open Library and read the bundled getting-started pack.</text>

    <rect x="40" y="156" width="900" height="54" rx="10" fill="#ffffff" stroke="#d8d8de"/>
    <text x="60" y="190">2. Configure LLM Base URL, API key, and chat model in Settings.</text>

    <rect x="40" y="224" width="900" height="54" rx="10" fill="#ffffff" stroke="#d8d8de"/>
    <text x="60" y="258">3. Ask a question, then inspect citations. Use @ focus for narrower retrieval.</text>

    <rect x="40" y="292" width="900" height="54" rx="10" fill="#ffffff" stroke="#d8d8de"/>
    <text x="60" y="326">4. Optionally connect Hub to browse/download more packs.</text>
  </g>
</svg>